@let b = book();

<article
  class="flex h-full flex-col overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900"
>
  <div class="relative aspect-[2/3] w-full bg-brand-50 dark:bg-gray-800">
    @if (b.coverUrl && !coverFailed()) {
      <img
        [ngSrc]="b.coverUrl"
        fill
        sizes="(min-width: 1024px) 25vw, (min-width: 640px) 50vw, 100vw"
        [alt]="'Cover of ' + b.title"
        class="object-cover"
        (error)="coverFailed.set(true)"
      />
    } @else {
      <!-- Decorative: the title is already in the card text below -->
      <div
        class="flex h-full items-center justify-center p-4 text-center font-serif text-lg text-brand-800 dark:text-brand-100"
        aria-hidden="true"
      >
        {{ b.title }}
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col gap-1 p-4">
    <h2 class="text-lg leading-snug font-semibold">
      <a
        [routerLink]="['/books', b.isbn]"
        class="hover:underline focus-visible:underline"
      >{{ b.title }}</a>
    </h2>
    <p class="text-sm text-gray-700 dark:text-gray-300">{{ b.author }}</p>
    <p class="text-sm text-gray-600 dark:text-gray-400">{{ b.genre }}</p>

    <div class="mt-auto flex items-center justify-between gap-2 pt-3">
      <span class="text-lg font-semibold">{{ b.price | currency: 'USD' }}</span>
      @if (b.inStock) {
        <span class="rounded-full bg-brand-50 px-2 py-0.5 text-sm text-brand-800 dark:bg-brand-800 dark:text-brand-50">
          In stock
        </span>
      } @else {
        <span class="rounded-full bg-gray-200 px-2 py-0.5 text-sm text-gray-800 dark:bg-gray-700 dark:text-gray-100">
          Out of stock
        </span>
      }
    </div>

    <button
      type="button"
      class="mt-3 rounded bg-brand-600 px-3 py-2 font-medium text-white hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-700 dark:disabled:bg-gray-700 dark:disabled:text-gray-300"
      [disabled]="!b.inStock"
      (click)="addToCart.emit(b)"
    >
      Add to cart<span class="sr-only">: {{ b.title }}</span>
    </button>
  </div>
</article>
