<h1 class="text-2xl font-semibold">Your account</h1>

@if (auth.customer(); as customer) {
  <dl class="mt-6 space-y-2">
    <div><dt class="inline font-medium">Name: </dt><dd class="inline">{{ customer.name }}</dd></div>
    <div><dt class="inline font-medium">Email: </dt><dd class="inline">{{ customer.email }}</dd></div>
  </dl>
  <button type="button" (click)="auth.logout()"
          class="mt-6 rounded border border-gray-400 px-4 py-2 dark:border-gray-600">
    Log out
  </button>
} @else {
  <p class="mt-4">You're not logged in. <a routerLink="/login" class="text-brand-700 underline dark:text-brand-100">Log in</a></p>
}
