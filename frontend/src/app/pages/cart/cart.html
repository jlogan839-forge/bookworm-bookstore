<h1 class="mb-6 text-2xl font-semibold">Your cart</h1>

<ul class="divide-y divide-gray-200 dark:divide-gray-800">
  @for (item of cart.items(); track item.isbn) {
    <li class="flex items-center justify-between py-4">
      <div>
        <p class="font-medium">{{ item.title }}</p>
        <p class="text-sm text-gray-500">{{ item.author }} · Qty {{ item.quantity }}</p>
      </div>
      <div class="flex items-center gap-4">
        <span>{{ item.price * item.quantity | currency }}</span>
        <button
          type="button"
          (click)="cart.remove(item.isbn)"
          class="text-sm text-red-600 hover:underline"
        >
          Remove
        </button>
      </div>
    </li>
  } @empty {
    <li class="py-4 text-gray-500">Your cart is empty.</li>
  }
</ul>

<p class="mt-6 text-right text-lg font-semibold">Total: {{ cart.total() | currency }}</p>
